# Fixed-node Kismet hardening for Passive Vigilance.
#
# deploy/install.sh appends this to /etc/kismet/kismet_site.conf idempotently
# (only if enable_logging is not already set). You can also append it by hand.
#
# enable_logging=false — turns off Kismet's own kismetdb SQLite logging.
#
# WHY: on this SD-card hardware Kismet's kismetdb fdatasync() runs *inside* the
# capture timer engine. When an SD-card sync stalls (>15s pauses observed), it
# blocks ALL datasource pings, so the wlan1 capture helper misses its keepalive
# and Kismet kills it as SOURCEERROR — a self-inflicted WiFi outage. This was
# proven by gdb (2026-07-05) and is NOT fixed by swapping the WiFi adapter or
# driver; disabling logging gave 22h/0 errors. Passive Vigilance keeps its own
# durable event store (entities.db), so Kismet's kismetdb is redundant here.
enable_logging=false
